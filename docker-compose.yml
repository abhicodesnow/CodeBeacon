services:
  postgres:
    image: postgres:15-alpine
    container_name: codebeacon-postgres-1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codebeacon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codebeacon-redis-1
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: