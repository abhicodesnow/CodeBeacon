version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codebeacon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codebeacon_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - codebeacon_net

networks:
  codebeacon_net:
    driver: bridge

volumes:
  postgres_data: